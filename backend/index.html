<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>India District Weather Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; }
  #panel { position: absolute; top: 0; bottom: 0; left: 0; width: 280px;
           padding: 14px; box-sizing: border-box; background: #f7f9fc;
           border-right: 1px solid #ccd; overflow: auto; z-index: 500; }
  #map { position: absolute; top: 0; bottom: 0; left: 280px; right: 0; }
  select, input[type=range] { width: 100%; margin: 6px 0 12px; }
  select { padding: 6px; }
  #legendBar { height: 14px; border: 1px solid #999; margin: 4px 0; }
  #legendLabels { display: flex; justify-content: space-between; font-size: 12px; }
  #info { font-size: 14px; line-height: 1.5; margin-top: 10px; }
</style>
</head>
<body>
<div id="panel">
  <h3>India District Weather</h3>
  <label>Layer</label>
  <select id="layer">
    <option value="rain">Annual rainfall</option>
    <option value="dry">Dryness score</option>
    <option value="temp">Max temperature</option>
    <option value="land">Landslide events</option>
    <option value="type">Rainfall type (grouping)</option>
    <option value="unusual">Unusually wet or dry year</option>
  </select>

  <label id="yearBox">Year: <b id="yearLabel">2020</b></label>
  <input type="range" id="year" min="1901" max="2025" value="2020">

  <div id="monthBox" style="display:none">
    <label>Month: <b id="monthLabel">5</b></label>
    <input type="range" id="month" min="1" max="12" value="5">
  </div>

  <div id="legendBar"></div>
  <div id="legendLabels"><span id="legMin"></span><span id="legMax"></span></div>
  <div id="legendName" style="font-size:12px;margin-top:4px"></div>

  <hr>
  <div id="info">Click a district for details.</div>
</div>
<div id="map"></div>

<script>
const map = L.map('map').setView([22.5, 80], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const SCALES = {
  rain: { min: 0,  max: 3000, stops: ['#f7fbff', '#6baed6', '#08306b'], name: 'Annual rainfall (mm)' },
  dry:  { min: 0,  max: 1,    stops: ['#fff5eb', '#fd8d3c', '#7f2704'], name: 'Dryness: relative ranking across India (not absolute)' },
  temp: { min: 10, max: 45,   stops: ['#2b83ba', '#ffffbf', '#d7191c'], name: 'Max temperature (°C), 1° grid' },
  land: { min: 0,  max: 20,   stops: ['#fff7fb', '#bdc9e1', '#810f7c'], name: 'Reported landslide events in the year (news-based, incomplete)' },
  type: { cat: true, name: 'Rainfall type: statistical grouping of the 1951-2020 monthly pattern, not a forecast', legend: '' },
  unusual: { cat: true, name: 'Year compared with the 1991-2020 normal range (10th to 90th percentile)', legend: 'Blue: unusually wet. Brown: unusually dry. Grey: within normal range.' }
};

const TYPE_COLORS = { 1: '#fdae61', 2: '#2b83ba', 3: '#abdda4', 4: '#d7191c' };
const FLAG_COLORS = { 'unusually wet': '#2166ac', 'unusually dry': '#b2182b', 'within normal range': '#e0e0e0' };
const FLAG_TEXT = {
  'unusually wet': 'Unusually wet compared with the 1991 to 2020 normal range',
  'unusually dry': 'Unusually dry compared with the 1991 to 2020 normal range',
  'within normal range': 'Within the 1991 to 2020 normal range'
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let boundaries = null, geoLayer = null, profileRows = [];
let rainData = {}, dryData = {}, tempData = {}, landData = {}, typeData = {}, unusualData = {};

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) return null;
  return r.json();
}

function hexToRgb(h) {
  return [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
}

function mix(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  return 'rgb(' + pa.map((x, i) => Math.round(x + (pb[i] - x) * t)).join(',') + ')';
}

function colorFor(v, sc) {
  if (v === null || v === undefined || isNaN(v)) return '#cccccc';
  let t = (v - sc.min) / (sc.max - sc.min);
  t = Math.max(0, Math.min(1, t));
  const n = sc.stops.length - 1;
  const seg = Math.min(n - 1, Math.floor(t * n));
  return mix(sc.stops[seg], sc.stops[seg + 1], t * n - seg);
}

function currentState() {
  return {
    layer: document.getElementById('layer').value,
    year: +document.getElementById('year').value,
    month: +document.getElementById('month').value
  };
}

async function loadData(s) {
  if (s.layer === 'rain') {
    const rows = await getJSON(`/map/rainfall?year=${s.year}`) || [];
    rainData = Object.fromEntries(rows.map(r => [r.match_key, r.rain_mm]));
  } else if (s.layer === 'dry') {
    if (!Object.keys(dryData).length) {
      const rows = await getJSON('/map/dryness') || [];
      dryData = Object.fromEntries(rows.map(r => [r.match_key, r]));
    }
  } else if (s.layer === 'temp') {
    const rows = await getJSON(`/map/temperature?year=${s.year}&month=${s.month}`) || [];
    tempData = Object.fromEntries(rows.map(r => [r.GID_2, r.tmax_mean]));
  } else if (s.layer === 'land') {
    const rows = await getJSON(`/map/landslides?year_from=${s.year}&year_to=${s.year}`) || [];
    landData = Object.fromEntries(rows.map(r => [r.GID_2, r.events]));
  } else if (s.layer === 'type') {
    if (!Object.keys(typeData).length) {
      const rows = await getJSON('/map/rainfall-type') || [];
      typeData = Object.fromEntries(rows.map(r => [r.GID_2, r.rainfall_type]));
    }
  } else if (s.layer === 'unusual') {
    const rows = await getJSON(`/map/unusual-years?year=${s.year}`) || [];
    unusualData = Object.fromEntries(rows.map(r => [r.GID_2, r]));
  }
}

function valueOf(p, s) {
  if (s.layer === 'rain') return rainData[p.match_key];
  if (s.layer === 'dry') return dryData[p.match_key] ? dryData[p.match_key].dryness_score : null;
  if (s.layer === 'land') return landData[p.GID_2];
  return tempData[p.GID_2];
}

function fillFor(p, s, sc) {
  if (s.layer === 'type') return TYPE_COLORS[typeData[p.GID_2]] || '#cccccc';
  if (s.layer === 'unusual') {
    const u = unusualData[p.GID_2];
    return u ? (FLAG_COLORS[u.flag] || '#cccccc') : '#cccccc';
  }
  return colorFor(valueOf(p, s), sc);
}

function drawLegend(sc) {
  const bar = document.getElementById('legendBar');
  const labels = document.getElementById('legendLabels');
  if (sc.cat) {
    bar.style.display = 'none';
    labels.style.display = 'none';
  } else {
    bar.style.display = 'block';
    labels.style.display = 'flex';
    bar.style.background = `linear-gradient(to right, ${sc.stops.join(',')})`;
    document.getElementById('legMin').textContent = sc.min;
    document.getElementById('legMax').textContent = sc.max + '+';
  }
  const extra = sc.legend ? ' ' + sc.legend : '';
  document.getElementById('legendName').textContent = sc.name + extra + '  (grey = no data)';
}

async function render() {
  const s = currentState();
  await loadData(s);
  if (geoLayer) map.removeLayer(geoLayer);
  const sc = SCALES[s.layer];
  geoLayer = L.geoJSON(boundaries, {
    style: f => ({
      fillColor: fillFor(f.properties, s, sc),
      color: '#444', weight: 0.4, fillOpacity: 0.85
    }),
    onEachFeature: (f, layer) => {
      layer.bindTooltip(`${f.properties.district}, ${f.properties.state}`);
      layer.on('click', () => showInfo(f.properties, s));
    }
  }).addTo(map);
  drawLegend(sc);
}

async function showInfo(p, s) {
  const info = document.getElementById('info');
  info.innerHTML = `<b>${p.district}</b>, ${p.state}<br>Loading...`;
  let html = `<b>${p.district}</b>, ${p.state}<br>`;

  if (s.layer === 'rain' || s.layer === 'dry') {
    const c = await getJSON(`/compare/${encodeURIComponent(p.match_key)}?year=${s.year}`);
    if (c) {
      html += `Year ${c.year}: <b>${c.this_year_mm} mm</b><br>` +
              `Normal (1991-2020): ${c.normal_1991_2020_mm} mm<br>` +
              `Departure: ${c.departure_from_normal_pct}% (${c.status})<br>`;
    } else {
      html += `No valid rainfall for ${s.year}<br>`;
    }
  }
  if (s.layer === 'dry' && dryData[p.match_key]) {
    const d = dryData[p.match_key];
    html += `<br>Dryness score: <b>${d.dryness_score}</b><br>` +
            `Dry chance (years below 25th percentile): ${Math.round(d.dry_chance_all_years * 100)}%<br>`;
  }
  if (s.layer === 'temp') {
    const v = tempData[p.GID_2];
    html += v !== null && v !== undefined
      ? `${MONTHS[s.month - 1]} ${s.year} max temp: <b>${v} °C</b><br>`
      : `No temperature for ${MONTHS[s.month - 1]} ${s.year}<br>`;
  }
  if (s.layer === 'land') {
    const L = await getJSON(`/landslides/${encodeURIComponent(p.GID_2)}?year_from=2007&year_to=2017`);
    if (L) {
      const yr = L.by_year.find(r => r.year === s.year);
      html += `Events in ${s.year}: <b>${yr ? yr.events : 0}</b><br>` +
              `Total 2007 to 2017: <b>${L.total_events}</b><br>`;
      if (L.recent_events.length) {
        html += `<br><b>Recent events (2007 to 2017)</b><table style="font-size:12px">` +
          L.recent_events.map(e =>
            `<tr><td>${e.event_date}</td><td>${e.landslide_category}</td></tr>`).join('') +
          `</table>`;
      } else {
        html += `No recorded events.<br>`;
      }
      html += `<div style="font-size:11px;color:#666;margin-top:6px">Source: NASA Global Landslide Catalog ` +
              `(news and reports). Counts reflect reporting, not hazard alone.</div>`;
    }
  }
  if (s.layer === 'type') {
    const t = typeData[p.GID_2];
    if (t) {
      const prof = profileRows.find(r => r.rainfall_type === t);
      html += `<b>Rainfall type ${t}</b><br>` +
              `Peak month: ${prof ? prof.peak_month : '-'}<br>` +
              `Average share of rain in June to September: ${prof ? prof.share_jun_sep_pct : '-'}%<br>` +
              `<div style="font-size:11px;color:#666;margin-top:6px">Statistical grouping of the 1951 to 2020 ` +
              `monthly pattern. Not a forecast. Source: IMD gridded rainfall, processed for this app.</div>`;
    } else {
      html += `No rainfall type (incomplete record for this district).<br>`;
    }
  }
  if (s.layer === 'unusual') {
    const u = unusualData[p.GID_2];
    if (u) {
      html += `Year ${s.year}: <b>${u.annual_mm} mm</b><br>` +
              `Normal range 1991 to 2020 (10th to 90th percentile): ${u.p10_mm} to ${u.p90_mm} mm<br>` +
              `<b>${FLAG_TEXT[u.flag] || u.flag}</b><br>` +
              `<div style="font-size:11px;color:#666;margin-top:6px">Historical comparison, not a forecast. ` +
              `Source: IMD gridded rainfall, processed for this app.</div>`;
    } else {
      html += `No complete rainfall record for ${s.year}.<br>`;
    }
  }

  // Live forecast
  const f = await getJSON(`/live/${encodeURIComponent(p.GID_2)}`);
  if (f) {
    html += `<hr><b>Live weather now</b><br>` +
            `${f.current.temp_c} °C, humidity ${f.current.humidity_pct}%<br>` +
            `${f.current.condition}, rain ${f.current.rain_mm} mm<br>` +
            `<table style="font-size:12px;margin-top:6px;border-collapse:collapse">` +
            `<tr><th align="left">Day</th><th>Max</th><th>Min</th><th>Rain</th><th align="left">Sky</th></tr>` +
            f.daily.map(d =>
              `<tr><td>${d.date.slice(5)}</td><td align="center">${d.max_c}°</td>` +
              `<td align="center">${d.min_c}°</td><td align="center">${d.rain_mm}</td>` +
              `<td>${d.condition}</td></tr>`).join('') +
            `</table>` +
            `<div style="font-size:11px;color:#666;margin-top:6px">${f.attribution}. ` +
            `Updated ${f.fetched_at}, refreshes every ${f.cache_minutes} min.</div>`;
  } else {
    html += `<hr>Live forecast unavailable right now.`;
  }

  info.innerHTML = html;
}

function setControls() {
  const layer = document.getElementById('layer').value;
  const year = document.getElementById('year');
  let minY = 1901, maxY = 2025;
  if (layer === 'temp') minY = 1951;
  if (layer === 'land') { minY = 2007; maxY = 2017; }
  year.min = minY;
  year.max = maxY;
  if (+year.value < minY) year.value = minY;
  if (+year.value > maxY) year.value = maxY;
  document.getElementById('yearLabel').textContent = year.value;
  const noYear = layer === 'dry' || layer === 'type';
  document.getElementById('yearBox').style.display = noYear ? 'none' : 'block';
  year.style.display = noYear ? 'none' : 'block';
  document.getElementById('monthBox').style.display = layer === 'temp' ? 'block' : 'none';
}

document.getElementById('layer').addEventListener('change', () => { setControls(); render(); });
document.getElementById('year').addEventListener('input', e =>
  document.getElementById('yearLabel').textContent = e.target.value);
document.getElementById('year').addEventListener('change', render);
document.getElementById('month').addEventListener('input', e =>
  document.getElementById('monthLabel').textContent = e.target.value);
document.getElementById('month').addEventListener('change', render);

(async () => {
  boundaries = await getJSON('/boundaries');
  profileRows = await getJSON('/rainfall-types') || [];
  SCALES.type.legend = profileRows.map(r =>
    `Type ${r.rainfall_type}: ${r.peak_month} peak, ${r.share_jun_sep_pct}% in June to September (${r.districts} districts).`
  ).join(' ');
  setControls();
  render();
})();
</script>
</body>
</html>
